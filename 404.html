<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>404 - Không tìm thấy trang | APMaths</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        .error-page {
            max-width: 700px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
        }

        .error-page h1 {
            margin: 0 0 20px;
            color: var(--primary);
            font-size: 6rem;
            line-height: 1;
        }

        .error-page h2 {
            margin: 0 0 15px;
        }

        .error-page p {
            color: var(--text-light);
            line-height: 1.7;
        }

        .countdown {
            margin-top: 25px;
            font-weight: 600;
            color: var(--primary);
        }

        .home-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 22px;
            background: var(--primary);
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
        }

        .home-button:hover {
            opacity: .9;
            text-decoration: none;
        }
    </style>

    <script>
        let seconds = 5;

        function countdown() {
            document.getElementById("countdown").textContent = seconds;

            if (seconds === 0) {
                window.location.href = "/";
                return;
            }

            seconds--;
            setTimeout(countdown, 1000);
        }

        window.onload = countdown;
    </script>
</head>

<body>

    <main class="error-page">

        <h1>404</h1>

        <h2>Không tìm thấy trang</h2>

        <p>
            Trang bạn đang tìm kiếm không tồn tại,
            đã được di chuyển hoặc không còn khả dụng.
        </p>

        <p class="countdown">
            Tự động chuyển về Trang chủ sau
            <span id="countdown">5</span> giây...
        </p>

        <a href="/" class="home-button">
            <i class="fa fa-home"></i>
            Về Trang chủ
        </a>

    </main>

</body>
</html>
