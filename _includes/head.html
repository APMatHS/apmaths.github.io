<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% assign page_title = page.title | default: site.title %}
{% assign page_description = page.description | default: site.description %}

<title>
{% if page.title %}
{{ page.title }} | {{ include.t.site.title }}
{% else %}
{{ include.t.site.title }}
{% endif %}
</title>

<meta name="description" content="{{ page_description }}">
<meta name="author" content="{{ site.author.name | default: site.author }}">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta name="theme-color" content="#1478f5">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:image" content="{{ '/assets/images/logo/og-image.jpg' | absolute_url }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_title }}">
<meta name="twitter:description" content="{{ page_description }}">
<meta name="twitter:image" content="{{ '/assets/images/logo/og-image.jpg' | absolute_url }}">

<link rel="icon" href="{{ '/assets/images/logo/favicon.ico' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/logo/icon-32x32.png' | relative_url }}?v=20260916-5">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/logo/icon-16x16.png' | relative_url }}?v=20260916-5">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/logo/apple-touch-icon.png' | relative_url }}?v=20260916-5">

<link rel="stylesheet" href="/css/style.css?v=20260916-10">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<script>
window.MathJax = {
    tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
    },
    options: {
        skipHtmlTags: ['script','noscript','style','textarea','pre','code']
    }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-polyfills/0.1.43/polyfill.min.js"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

{% include google.html %}

<script async defer crossorigin="anonymous" src="https://connect.facebook.net/vi_VN/sdk.js#xfbml=1&version=v18.0&appId=3686401291644500"></script>
<script type="module" src="{{ '/js/supabase.js' | relative_url }}"></script>

</head>
