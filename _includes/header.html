<header class="site-header">
    <div class="site-header-inner">

        <a class="site-brand" href="/" aria-label="APMaths - {{ include.t.nav.home }}">
            <img
                src="/assets/images/ap-mark.svg?v=4"
                alt="AP"
                class="site-logo">

            <span class="site-brand-copy">
                <span class="site-title"><span class="site-title-ap">AP</span><span class="site-title-maths">Maths</span></span>
                <span class="site-tagline">{{ include.t.site.tagline }}</span>

        <button
            class="mobile-nav-toggle"
            type="button"
            aria-controls="site-navigation"
            aria-expanded="false"
            aria-label="{{ include.t.nav.menu }}">
            <span class="mobile-nav-toggle__line" aria-hidden="true"></span>
            <span class="mobile-nav-toggle__line" aria-hidden="true"></span>
            <span class="mobile-nav-toggle__line" aria-hidden="true"></span>
