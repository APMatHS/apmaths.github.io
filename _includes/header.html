<header class="site-header">
    <div class="site-header-inner">

        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="APMaths - {{ include.t.nav.home }}">
            <img
                src="{{ '/assets/images/logo/icon-192x192.png' | relative_url }}?v=20260916-5"
                alt=""
                aria-hidden="true"
                class="site-logo"
                width="40"
                height="40"
                decoding="async">
            <span class="site-brand-text">APMaths</span>
        </a>

        <div class="mobile-header-actions">
            <a class="mobile-clo{% if page.url contains '/ai-clo/' %} is-current{% endif %}"
               href="/ai-clo/app.html"
               aria-label="Vào hệ thống AI·CLO APMaths">CLO</a>

            <button
                class="mobile-nav-toggle"
                type="button"
                aria-controls="site-navigation"
                aria-expanded="false"
                aria-label="{{ include.t.nav.menu }}">
                <span class="mobile-nav-toggle__line" aria-hidden="true"></span>
                <span class="mobile-nav-toggle__line" aria-hidden="true"></span>
                <span class="mobile-nav-toggle__line" aria-hidden="true"></span>
            </button>
        </div>

        <nav id="site-navigation" class="site-nav" aria-label="Main navigation">
            {% include menu.html t=include.t %}
        </nav>

    </div>
</header>
