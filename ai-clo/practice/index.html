<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Rút đề ôn tập PDF | AI-CLO PTITHCM</title>
  <link rel="stylesheet" href="./practice.css">
  <script src="../js/config.js"></script>
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }, svg: { fontCache: 'global' } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>
  <script defer src="./pdf.js"></script>
  <script defer src="./practice.js"></script>
</head>
<body>
  <main class="shell public-shell">
    <header class="brandbar">
      <div>
        <div class="eyebrow">AI-CLO PTITHCM</div>
        <h1>Rút đề ôn tập PDF</h1>
        <p class="muted">Không cần đăng nhập. Nhập mã do giảng viên cung cấp để rút một đề mới.</p>
      </div>
      <a class="ghost-link" href="./admin.html">Giảng viên</a>
    </header>

    <section id="codeCard" class="card code-card">
      <label for="accessCode">Mã môn / mã rút đề</label>
      <div class="code-row">
        <input id="accessCode" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" placeholder="Ví dụ: TCS-7K9P">
        <button id="openBtn" class="primary">Mở môn</button>
      </div>
      <p id="codeMessage" class="message" aria-live="polite"></p>
    </section>

    <section id="practicePanel" class="card hidden">
      <div class="panel-head">
        <div>
          <div id="subjectMeta" class="eyebrow"></div>
          <h2 id="practiceTitle">Đề ôn tập</h2>
          <p id="practiceMeta" class="muted"></p>
        </div>
        <button id="changeCodeBtn" class="secondary">Đổi mã</button>
      </div>

      <div class="action-row">
        <button id="drawBtn" class="primary big">Rút đề mới &amp; tạo PDF</button>
        <span id="drawStatus" class="message" aria-live="polite"></span>
      </div>

      <div id="resultPanel" class="result-panel hidden">
        <div class="result-toolbar">
          <div>
            <strong>Mã đề luyện tập: <span id="seedText">—</span></strong>
            <div class="muted small">Giữ mã này nếu cần tái tạo đúng đề.</div>
          </div>
          <div class="toolbar-actions">
            <button id="downloadBtn" class="primary">Tải PDF</button>
            <button id="redrawBtn" class="secondary">Rút đề khác</button>
          </div>
        </div>
        <iframe id="pdfPreview" class="pdf-preview" title="Xem trước đề PDF"></iframe>
      </div>
    </section>

    <footer class="page-footer">Cổng ôn tập độc lập • chỉ lấy câu hỏi luyện tập đã duyệt</footer>
  </main>
</body>
</html>
