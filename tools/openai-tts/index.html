<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OpenAI Text to Speech | APMaths</title>
    <meta name="description" content="Chuyển văn bản thành giọng nói bằng OpenAI Text to Speech.">
    <meta name="author" content="APMaths">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <h1>OpenAI Text to Speech</h1>
            <p>Chuyển văn bản thành giọng nói</p>
        </div>
    </header>

    <main class="container">

        <section class="tts-card">

            <div class="form-group">
                <label for="textInput">Văn bản</label>

                <textarea
                    id="textInput"
                    rows="10"
                    placeholder="Nhập văn bản bạn muốn chuyển thành giọng nói..."
                ></textarea>

                <div class="text-info">
                    <span id="charCount">0 ký tự</span>
                </div>
            </div>


            <div class="settings-grid">

                <div class="form-group">
                    <label for="voiceSelect">Giọng nói</label>

                    <select id="voiceSelect">
                        <option value="alloy">Alloy</option>
                        <option value="ash">Ash</option>
                        <option value="ballad">Ballad</option>
                        <option value="coral">Coral</option>
                        <option value="echo">Echo</option>
                        <option value="fable">Fable</option>
                        <option value="nova">Nova</option>
                        <option value="onyx">Onyx</option>
                        <option value="sage">Sage</option>
                        <option value="shimmer">Shimmer</option>
                    </select>
                </div>


                <div class="form-group">

                    <label for="speedRange">
                        Tốc độ:
                        <span id="speedValue">1.0×</span>
                    </label>

                    <input
                        type="range"
                        id="speedRange"
                        min="0.5"
                        max="2"
                        step="0.1"
                        value="1"
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="instructionsInput">
                    Hướng dẫn giọng đọc
                    <span class="optional">(tùy chọn)</span>
                </label>

                <input
                    type="text"
                    id="instructionsInput"
                    placeholder="Ví dụ: Đọc chậm rãi, rõ ràng, phù hợp với bài giảng Toán."
                >

            </div>


            <div class="actions">

                <button
                    id="generateButton"
                    class="primary-button"
                    type="button"
                >
                    🔊 Tạo giọng nói
                </button>

                <button
                    id="stopButton"
                    class="secondary-button"
                    type="button"
                    disabled
                >
                    ⏹ Dừng
                </button>

            </div>


            <div
                id="status"
                class="status"
                aria-live="polite"
            ></div>


            <section
                id="audioSection"
                class="audio-section"
                hidden
            >

                <h2>Audio</h2>

                <audio
                    id="audioPlayer"
                    controls
                    preload="metadata"
                ></audio>

                <a
                    id="downloadButton"
                    class="download-button"
                    href="#"
                    download="openai-tts.mp3"
                >
                    💾 Tải xuống
                </a>

            </section>

        </section>

    </main>


    <footer class="site-footer">
        <div class="container">
            <p>
                © <span id="currentYear"></span> APMaths
            </p>
        </div>
    </footer>


    <script src="script.js"></script>

</body>
</html>
