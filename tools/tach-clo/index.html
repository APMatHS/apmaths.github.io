<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Công cụ Tách-CLO Trực Tuyến V3.1 (Bảo toàn GPA)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { 
            font-family: "Times New Roman", Times, serif; 
            margin: 20px; 
            background-color: #f4f6f9; 
            font-size: 16px;
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            max-width: 1100px; 
            margin: auto; 
        }
        h2 { 
            color: #333; 
            text-align: center; 
            font-family: "Times New Roman", Times, serif;
            margin-top: 5px;
            margin-bottom: 20px;
        }
        .main-layout {
            display: flex;
            gap: 20px;
        }
        .column-left, .column-right {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .form-group { 
            margin-bottom: 12px; 
            display: flex;
            flex-direction: column;
        }
        label { 
            display: block; 
            margin-bottom: 4px; 
            font-weight: bold; 
            font-size: 15px;
        }
        textarea { 
            width: 100%; 
            height: 160px; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-family: "Times New Roman", Times, serif;
            font-size: 15px;
            box-sizing: border-box;
            resize: none;
        }
        input[type="number"] {
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: "Times New Roman", Times, serif;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        .ratio-inputs-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            gap: 8px;
            margin-bottom: 5px;
        }
        .ratio-box {
            display: flex;
            flex-direction: column;
        }
        .ratio-box label {
            font-size: 12px;
            font-weight: normal;
            text-align: center;
            margin-bottom: 2px;
        }
        .action-row {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .action-row > button {
            flex: 1;
        }
        button { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 4px; 
            font-size: 15px; 
            cursor: pointer; 
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            box-sizing: border-box;
        }
        button:hover:not(:disabled) { 
            opacity: 0.9; 
        }
        #btnDownload {
            background-color: #007bff;
        }
        #btnDownload:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
        }
        #btnClear {
            background-color: #dc3545;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-family: "Times New Roman", Times, serif;
            font-size: 15px;
        }
        th, td { 
            border: 1px solid #000000; 
            padding: 6px; 
            text-align: center; 
            vertical-align: middle;
        }
        th { 
            background-color: #e2e8f0; 
            color: #000;
            font-weight: bold;
        }
        .table-container {
            max-height: 295px; 
            overflow-y: auto; 
            border: 1px solid #ccc; 
            border-radius: 4px;
            background: #fff;
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Hệ thống Tách-CLO Trực Tuyến - Phiên bản V3.1</h2>
    
    <div class="main-layout">
        <div class="column-left">
            <div class="form-group">
                <label for="gpaInput">1. Dán cột điểm GPA vào đây:</label>
                <textarea id="gpaInput" placeholder="Ví dụ:&#10;9.0&#10;8.5&#10;7.0&#10;1.5"></textarea>
            </div>
            
            <div class="form-group">
                <label for="numClo">2. Số lượng thành phần CLO:</label>
                <input type="number" id="numClo" min="1" max="6" value="3" onchange="generateRatioInputs()">
            </div>

            <div class="form-group">
                <label>3. Tỷ lệ % cho từng CLO (Tổng bằng 100%):</label>
                <div id="ratioFields" class="ratio-inputs-container"></div>
            </div>

            <button onclick="confirmConfig()" style="background-color: #17a2b8; margin-top: 5px;">Xác nhận cấu hình tỷ lệ</button>
        </div>

        <div class="column-right">
            <label>4. Bảng kết quả sau khi tách:</label>
            <div class="table-container">
                <table id="resultTable">
                    <thead>
                        <tr id="tableHeaderRow">
                            <th>STT</th>
                            <th>GPA</th>
                            <th>CLO1</th>
                            <th>CLO2</th>
                            <th>CLO3</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="action-row">
        <button id="btnProcess" onclick="processGPAData()" disabled style="background-color: #6c757d; cursor: not-allowed; opacity: 0.6;">Bắt đầu Tách-CLO</button>
        <button id="btnClear" onclick="clearData()">Xóa dữ liệu</button>
        <button id="btnDownload" onclick="downloadExcel()" disabled>Tải file Excel kết quả</button>
    </div>
</div>

<script>
let lastProcessedData = [];
let currentWeights = [];

window.onload = function() {
    generateRatioInputs();
};

function generateRatioInputs() {
    let num = parseInt(document.getElementById('numClo').value);
    if (isNaN(num) || num < 1) num = 1;
    if (num > 6) num = 6;
    document.getElementById('numClo').value = num;

    let container = document.getElementById('ratioFields');
    container.innerHTML = "";

    let defaultRatios = num === 3 ? [30, 50, 20] : [];
    for (let i = 0; i < num; i++) {
        let val = defaultRatios[i] !== undefined ? defaultRatios[i] : Math.floor(100 / num);
        let div = document.createElement('div');
        div.className = 'ratio-box';
        div.innerHTML = `<label>CLO${i+1}</label><input type="number" class="ratio-input" value="${val}" min="1" max="100">`;
        container.appendChild(div);
    }
    lockProcessButton(false);
}

function confirmConfig() {
    let inputs = document.querySelectorAll('.ratio-input');
    let sum = 0;
    let weights = [];
    
    inputs.forEach(input => {
        let val = parseFloat(input.value);
        if (isNaN(val)) val = 0;
        weights.push(val);
        sum += val;
    });

    if (Math.abs(sum - 100) > 0.01) {
        alert("Tổng tỷ lệ các CLO phải bằng đúng 100%! Hiện tại tổng đang là: " + sum + "%");
        return;
    }

    currentWeights = weights.map(w => w / 100.0);

    let headerRow = document.getElementById('tableHeaderRow');
    let headerHTML = '<th>STT</th><th>GPA</th>';
    for (let i = 0; i < weights.length; i++) {
        headerHTML += `<th>CLO${i+1}</th>`;
    }
    headerRow.innerHTML = headerHTML;

    lockProcessButton(true);
    alert("Xác nhận cấu hình thành công! Bạn có thể bấm 'Bắt đầu Tách-CLO'.");
}

function lockProcessButton(isUnlocked) {
    let btnProcess = document.getElementById('btnProcess');
    if (isUnlocked) {
        btnProcess.disabled = false;
        btnProcess.style.backgroundColor = "#28a745";
        btnProcess.style.cursor = "pointer";
        btnProcess.style.opacity = "1";
    } else {
        btnProcess.disabled = true;
        btnProcess.style.backgroundColor = "#6c757d";
        btnProcess.style.cursor = "not-allowed";
        btnProcess.style.opacity = "0.6";
    }
}

// Hàm làm tròn đến bước nhảy thập phân cho phép (.0, .3, .5, .8)
function roundToAllowed(val) {
    const allowed = [0.0, 0.3, 0.5, 0.8];
    let intPart = Math.floor(val);
    let fracPart = val - intPart;
    let closest = allowed.reduce((prev, curr) => Math.abs(curr - fracPart) < Math.abs(prev - fracPart) ? curr : prev);
    return Number((intPart + closest).toFixed(1));
}

function processGPAData() {
    if (currentWeights.length === 0) {
        alert("Vui lòng bấm 'Xác nhận cấu hình tỷ lệ' trước khi thực hiện tách!");
        return;
    }

    let rawText = document.getElementById('gpaInput').value.trim();
    if (!rawText) {
        alert("Vui lòng dán danh sách điểm GPA vào ô trống!");
        return;
    }

    let lines = rawText.split(/\r?\n/);
    lastProcessedData = [];
    let tbodyHTML = "";
    let n = currentWeights.length;

    for (let index = 0; index < lines.length; index++) {
        let valStr = lines[index].trim();
        if (valStr === "") continue;
        
        let gpa = parseFloat(valStr.replace(',', '.'));
        
        if (isNaN(gpa) || gpa < 0 || gpa > 10) {
            alert(`Dòng ${index + 1} có giá trị GPA không hợp lệ (${valStr}). Vui lòng nhập từ 0 đến 10.`);
            return;
        }

        let cloScores = [];

        // Trường hợp GPA đạt điểm tuyệt đối
        if (gpa >= 9.95) {
            cloScores = new Array(n).fill(10.0);
        } else {
            let max_e = 0;
            if (gpa > 2.0 && gpa <= 4.0) max_e = 0.2;
            else if (gpa > 4.0 && gpa <= 6.0) max_e = 0.3;
            else if (gpa > 6.0) max_e = 0.5;

            let minCloThreshold = 0;
            if (gpa >= 8.5) minCloThreshold = 6.8;
            else if (gpa >= 7.0) minCloThreshold = 5.3;
            else if (gpa >= 5.0) minCloThreshold = 4.0;
            else if (gpa >= 1.0) minCloThreshold = 0.3;

            let validFound = false;
            let finalC = [];
            let maxIterations = 200; // Giới hạn tối đa 200 vòng lặp thử
            let iter = 0;

            while (!validFound && iter < maxIterations) {
                iter++;
                let deltas = new Array(n).fill(0);
                
                if (n === 1) {
                    finalC = [gpa];
                    validFound = true;
                    break;
                }

                let limitStep = Math.round(max_e * 10);
                let currentSumWDelta = 0;

                // Sinh n-1 delta ngẫu nhiên
                for (let i = 0; i < n - 1; i++) {
                    let randStep = Math.floor(Math.random() * (2 * limitStep + 1)) - limitStep;
                    deltas[i] = randStep / 10.0;
                    currentSumWDelta += currentWeights[i] * deltas[i];
                }

                // Tính delta cuối cùng chính xác theo siêu phẳng sum(w_i * delta_i) = 0
                let w_last = currentWeights[n - 1];
                if (w_last > 0) {
                    let d_last = -currentSumWDelta / w_last;
                    deltas[n - 1] = Number(d_last.toFixed(1));
                }

                let candidateC = deltas.map(d => Number((gpa + d).toFixed(1)));

                let inRange = candidateC.every(c => c >= 0 && c <= 10);
                let passThreshold = candidateC.every(c => c >= minCloThreshold);

                if (inRange && passThreshold) {
                    let checkSum = 0;
                    for (let i = 0; i < n; i++) checkSum += currentWeights[i] * candidateC[i];
                    
                    if (Math.abs(checkSum - gpa) < 0.001) {
                        // Bước làm tròn chuẩn và bù sai số nhỏ
                        let roundedC = candidateC.map(c => roundToAllowed(c));
                        
                        let roundedSum = 0;
                        for (let i = 0; i < n; i++) roundedSum += currentWeights[i] * roundedC[i];
                        let errorDiff = Number((gpa - roundedSum).toFixed(2));

                        if (n > 0 && Math.abs(errorDiff) > 0.0001) {
                            let lastIdx = n - 1;
                            let adjustedLast = roundedC[lastIdx] + (errorDiff / currentWeights[lastIdx]);
                            roundedC[lastIdx] = Number(Math.max(0, Math.min(10, adjustedLast)).toFixed(1));
                        }

                        // Kiểm tra hậu kỳ kỹ lưỡng sau khi bù sai số làm tròn
                        let finalCheckSum = 0;
                        for (let i = 0; i < n; i++) finalCheckSum += currentWeights[i] * roundedC[i];

                        if (Math.abs(finalCheckSum - gpa) <= 0.05) {
                            finalC = roundedC;
                            validFound = true;
                        }
                    }
                }
            }

            // Lớp bảo vệ cuối cùng: Nếu vẫn thất bại sau 200 lần thử, fallback an toàn gán đều về GPA
            if (!validFound) {
                finalC = new Array(n).fill(gpa);
            }

            cloScores = finalC;
        }

        let rowData = {
            "STT": lastProcessedData.length + 1,
            "GPA": gpa
        };
        
        let trHTML = `<td>${rowData["STT"]}</td><td>${rowData["GPA"]}</td>`;
        cloScores.forEach((score, idx) => {
            rowData[`CLO${idx+1}`] = score;
            trHTML += `<td>${score}</td>`;
        });

        lastProcessedData.push(rowData);
        tbodyHTML += `<tr>${trHTML}</tr>`;
    }

    document.querySelector("#resultTable tbody").innerHTML = tbodyHTML;

    let btnDownload = document.getElementById('btnDownload');
    btnDownload.disabled = false;
    btnDownload.style.cursor = "pointer";
    btnDownload.style.opacity = "1";
}

function clearData() {
    document.getElementById('gpaInput').value = "";
    document.querySelector("#resultTable tbody").innerHTML = "";
    lastProcessedData = [];
    
    let btnDownload = document.getElementById('btnDownload');
    btnDownload.disabled = true;
    btnDownload.style.cursor = "not-allowed";
    btnDownload.style.opacity = "0.6";

    lockProcessButton(false);
}

function downloadExcel() {
    if (lastProcessedData.length === 0) return;
    let worksheet = XLSX.utils.json_to_sheet(lastProcessedData);
    let workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "KetQua_CLO_V3.1");
    XLSX.writeFile(workbook, "KetQua_Tach_CLO_V3.1.xlsx");
}
</script>

</body>
</html>
