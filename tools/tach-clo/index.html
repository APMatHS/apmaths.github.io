<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Công cụ Tách-CLO Trực Tuyến V2.2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { 
            font-family: "Times New Roman", Times, serif; 
            margin: 20px; 
            background-color: #f4f6f9; 
            font-size: 16px;
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            max-width: 1100px; 
            margin: auto; 
        }
        h2 { 
            color: #333; 
            text-align: center; 
            font-family: "Times New Roman", Times, serif;
            margin-top: 5px;
            margin-bottom: 20px;
        }
        .main-layout {
            display: flex;
            gap: 20px;
        }
        .column-left, .column-right {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .form-group { 
            margin-bottom: 12px; 
            display: flex;
            flex-direction: column;
        }
        label { 
            display: block; 
            margin-bottom: 4px; 
            font-weight: bold; 
            font-size: 15px;
        }
        textarea { 
            width: 100%; 
            height: 160px; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-family: "Times New Roman", Times, serif;
            font-size: 15px;
            box-sizing: border-box;
            resize: none;
        }
        input[type="number"] {
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: "Times New Roman", Times, serif;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        .ratio-inputs-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            gap: 8px;
            margin-bottom: 5px;
        }
        .ratio-box {
            display: flex;
            flex-direction: column;
        }
        .ratio-box label {
            font-size: 12px;
            font-weight: normal;
            text-align: center;
            margin-bottom: 2px;
        }
        .action-row {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .action-row > button {
            flex: 1;
        }
        button { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 4px; 
            font-size: 15px; 
            cursor: pointer; 
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            box-sizing: border-box;
        }
        button:hover:not(:disabled) { 
            opacity: 0.9; 
        }
        #btnDownload {
            background-color: #007bff;
        }
        #btnDownload:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
        }
        #btnClear {
            background-color: #dc3545;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-family: "Times New Roman", Times, serif;
            font-size: 15px;
        }
        th, td { 
            border: 1px solid #000000; 
            padding: 6px; 
            text-align: center; 
            vertical-align: middle;
        }
        th { 
            background-color: #e2e8f0; 
            color: #000;
            font-weight: bold;
        }
        .table-container {
            max-height: 295px; 
            overflow-y: auto; 
            border: 1px solid #ccc; 
            border-radius: 4px;
            background: #fff;
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Hệ thống Tách-CLO Trực Tuyến - Phiên bản V2.2</h2>
    
    <div class="main-layout">
        <!-- Cột Trái: Ô nhập GPA & Cấu hình CLO -->
        <div class="column-left">
            <div class="form-group">
                <label for="gpaInput">1. Dán cột điểm GPA vào đây:</label>
                <textarea id="gpaInput" placeholder="Ví dụ:&#10;8.5&#10;7.2&#10;6.0&#10;2.5"></textarea>
            </div>
            
            <div class="form-group">
                <label for="numClo">2. Số lượng thành phần CLO:</label>
                <input type="number" id="numClo" min="1" max="6" value="3" onchange="generateRatioInputs()">
            </div>

            <div class="form-group">
                <label>3. Tỷ lệ % cho từng CLO (Tổng bằng 100%):</label>
                <div id="ratioFields" class="ratio-inputs-container">
                    <!-- Sinh tự động bằng JS -->
                </div>
            </div>

            <button onclick="confirmConfig()" style="background-color: #17a2b8; margin-top: 5px;">Xác nhận cấu hình tỷ lệ</button>
        </div>

        <!-- Cột Phải: Bảng kết quả -->
        <div class="column-right">
            <label>4. Bảng kết quả sau khi tách:</label>
            <div class="table-container">
                <table id="resultTable">
                    <thead>
                        <tr id="tableHeaderRow">
                            <th>STT</th>
                            <th>GPA</th>
                            <th>CLO1</th>
                            <th>CLO2</th>
                            <th>CLO3</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Kết quả hiển thị ở đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Hàng nút điều khiển phía dưới -->
    <div class="action-row">
        <button id="btnProcess" onclick="processGPAData()" disabled style="background-color: #6c757d; cursor: not-allowed; opacity: 0.6;">Bắt đầu Tách-CLO</button>
        <button id="btnClear" onclick="clearData()">Xóa dữ liệu</button>
        <button id="btnDownload" onclick="downloadExcel()" disabled>Tải file Excel kết quả</button>
    </div>
</div>

<script>
let lastProcessedData = [];
let currentWeights = [];

window.onload = function() {
    generateRatioInputs();
};

function generateRatioInputs() {
    let num = parseInt(document.getElementById('numClo').value);
    if (isNaN(num) || num < 1) num = 1;
    if (num > 6) num = 6;
    document.getElementById('numClo').value = num;

    let container = document.getElementById('ratioFields');
    container.innerHTML = "";

    let defaultRatios = num === 3 ? [30, 50, 20] : [];
    for (let i = 0; i < num; i++) {
        let val = defaultRatios[i] !== undefined ? defaultRatios[i] : Math.floor(100 / num);
        let div = document.createElement('div');
        div.className = 'ratio-box';
        div.innerHTML = `<label>CLO${i+1}</label><input type="number" class="ratio-input" value="${val}" min="1" max="100">`;
        container.appendChild(div);
    }
    lockProcessButton(false);
}

function confirmConfig() {
    let inputs = document.querySelectorAll('.ratio-input');
    let sum = 0;
    let weights = [];
    
    inputs.forEach(input => {
        let val = parseFloat(input.value);
        if (isNaN(val)) val = 0;
        weights.push(val);
        sum += val;
    });

    if (Math.abs(sum - 100) > 0.01) {
        alert("Tổng tỷ lệ các CLO phải bằng đúng 100%! Hiện tại tổng đang là: " + sum + "%");
        return;
    }

    currentWeights = weights.map(w => w / 100.0);

    let headerRow = document.getElementById('tableHeaderRow');
    let headerHTML = '<th>STT</th><th>GPA</th>';
    for (let i = 0; i < weights.length; i++) {
        headerHTML += `<th>CLO${i+1}</th>`;
    }
    headerRow.innerHTML = headerHTML;

    lockProcessButton(true);
    alert("Xác nhận cấu hình thành công! Bạn có thể bấm 'Bắt đầu Tách-CLO'.");
}

function lockProcessButton(isUnlocked) {
    let btnProcess = document.getElementById('btnProcess');
    if (isUnlocked) {
        btnProcess.disabled = false;
        btnProcess.style.backgroundColor = "#28a745";
        btnProcess.style.cursor = "pointer";
        btnProcess.style.opacity = "1";
    } else {
        btnProcess.disabled = true;
        btnProcess.style.backgroundColor = "#6c757d";
        btnProcess.style.cursor = "not-allowed";
        btnProcess.style.opacity = "0.6";
    }
}

function roundToAllowed(val) {
    const allowed = [0.0, 0.3, 0.5, 0.8];
    let intPart = Math.floor(val);
    let fracPart = val - intPart;
    let closest = allowed.reduce((prev, curr) => Math.abs(curr - fracPart) < Math.abs(prev - fracPart) ? curr : prev);
    return Number((intPart + closest).toFixed(1));
}

function processGPAData() {
    if (currentWeights.length === 0) {
        alert("Vui lòng bấm 'Xác nhận cấu hình tỷ lệ' trước khi thực hiện tách!");
        return;
    }

    let rawText = document.getElementById('gpaInput').value.trim();
    if (!rawText) {
        alert("Vui lòng dán danh sách điểm GPA vào ô trống!");
        return;
    }

    let lines = rawText.split(/\r?\n/);
    lastProcessedData = [];
    let tbody = document.querySelector("#resultTable tbody");
    tbody.innerHTML = "";

    lines.forEach((line, index) => {
        let valStr = line.trim();
        if (valStr === "") return;
        
        let gpa = parseFloat(valStr.replace(',', '.'));
        if (isNaN(gpa)) return;

        let numCols = currentWeights.length;

        let max_e;
        if (gpa < 3.0) {
            max_e = 0;
        } else if (gpa > 7.0) {
            max_e = 0.5;
        } else if (gpa > 5.0) {
            max_e = 0.3;
        } else {
            max_e = 0.2;
        }

        let subScores = [];
        let sumSub = 0;

        for (let i = 0; i < numCols; i++) {
            let baseVal = gpa * currentWeights[i];
            let e = 0;
            if (max_e > 0 && i < numCols - 1) {
                let steps = [];
                for (let s = -max_e; s <= max_e + 0.001; s += 0.1) {
                    steps.push(Number(s.toFixed(1)));
                }
                e = steps[Math.floor(Math.random() * steps.length)];
            }
            let adjusted = roundToAllowed(baseVal + e);
            subScores.push(adjusted);
            sumSub += adjusted;
        }

        let lastIdx = numCols - 1;
        let finalSub = Number((gpa - (sumSub - subScores[lastIdx])).toFixed(2));
        subScores[lastIdx] = Math.max(0, finalSub);

        let cloScores = subScores.map((sub, idx) => {
            let w = currentWeights[idx];
            let cloVal = w > 0 ? Number((sub / w).toFixed(1)) : 0;
            
            if (gpa >= 8.5) {
                if (cloVal <= 6.5) cloVal = 6.8;
            } else if (gpa >= 7.0) {
                if (cloVal <= 5.0) cloVal = 5.3;
            } else if (gpa >= 5.0) {
                if (cloVal < 4.0) cloVal = 4.0;
            } else if (gpa >= 1.0) {
                if (cloVal <= 0) cloVal = 0.3;
            }

            return Math.max(0, Math.min(10, cloVal));
        });

        let rowData = {
            "STT": index + 1,
            "GPA": gpa
        };
        
        let trHTML = `<td>${rowData["STT"]}</td><td>${rowData["GPA"]}</td>`;
        cloScores.forEach((score, idx) => {
            rowData[`CLO${idx+1}`] = score;
            trHTML += `<td>${score}</td>`;
        });

        lastProcessedData.push(rowData);
        tbody.innerHTML += `<tr>${trHTML}</tr>`;
    });

    let btnDownload = document.getElementById('btnDownload');
    btnDownload.disabled = false;
    btnDownload.style.cursor = "pointer";
    btnDownload.style.opacity = "1";
}

function clearData() {
    document.getElementById('gpaInput').value = "";
    document.querySelector("#resultTable tbody").innerHTML = "";
    lastProcessedData = [];
    
    let btnDownload = document.getElementById('btnDownload');
    btnDownload.disabled = true;
    btnDownload.style.cursor = "not-allowed";
    btnDownload.style.opacity = "0.6";

    lockProcessButton(false);
}

function downloadExcel() {
    if (lastProcessedData.length === 0) return;
    let table = document.getElementById("resultTable");
    let wb = XLSX.utils.table_to_book(table, {sheet: "KetQua_CLO_V2.2"});
    XLSX.writeFile(wb, "KetQua_Tach_CLO_V2.2.xlsx");
}
</script>

</body>
</html>
